models:
- name: dim_customers
  description: This model consolidates customer information, including their order
    history and tier classification, to provide a comprehensive view of customer engagement
    and value. It is useful for analyzing customer behavior and segmenting customers
    based on their purchase activity.
  columns:
  - name: customer_id
    description: A unique identifier for each customer.
    data_tests:
      - unique
      - not_null
  - name: full_name
    description: The full name of the customer.
    data_tests:
      - not_null
  - name: first_order_date
    description: The date when the customer placed their first order.
  - name: most_recent_order_date
    description: The date when the customer placed their most recent order.
  - name: number_of_orders
    description: The total number of orders placed by the customer.
  - name: customer_tier
    description: The classification of the customer based on their total spending,
      categorized as gold, silver, or bronze.
    data_tests:
      - accepted_values:
          values: ['gold', 'silver', 'bronze']